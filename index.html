<!DOCTYPE html>
<html>
<head>
    <title>College Event Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>College Event Registration</h1>
    <form id="registrationForm">
        <input type="text" id="name" placeholder="Student Name" required>
        <input type="text" id="regNo" placeholder="Register Number" required>
        <select id="department" required>
            <option value="">Select Department</option>
            <option>IT</option><option>CSE</option><option>ECE</option>
            <option>EEE</option><option>MECH</option>
        </select>
        <select id="event" required>
            <option value="">Select Event</option>
            <option>Coding Contest</option><option>Hackathon</option>
            <option>Paper Presentation</option><option>Quiz</option>
        </select>
        <button type="submit">Register</button>
    </form>
    <p id="message"></p>
    <a href="admin.html">View Registrations</a>
</div>
<script type="module" src="script.js"></script>
</body>
</html>
